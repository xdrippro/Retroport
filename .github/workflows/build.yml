name: GPS Tracker v3 - Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gps-tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Detect project folder
        id: project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f settings.gradle && -f app/build.gradle ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f gpsv3/settings.gradle.kts && -f gpsv3/app/build.gradle.kts ]]; then
            echo "dir=gpsv3" >> "$GITHUB_OUTPUT"
          elif [[ -f gpsv3/settings.gradle && -f gpsv3/app/build.gradle ]]; then
            echo "dir=gpsv3" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find Android project. Expected settings.gradle(.kts) and app/build.gradle(.kts) in repository root or gpsv3/."
            find . -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
            exit 1
          fi

      - name: Install Android platforms
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "platforms;android-37" "build-tools;35.0.0"

      - name: Set up Gradle if wrapper is missing
        if: ${{ hashFiles(format('{0}/gradlew', steps.project.outputs.dir)) == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug --stacktrace --console=plain
          else
            gradle --no-daemon :app:assembleDebug --stacktrace --console=plain
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tracker-v3-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
