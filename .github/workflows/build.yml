name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Loyiha repo ildizida ham, ichki papkada ham bo'lsa topadi
      - name: Gradle loyihasini topish
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/build/*' -print -quit)
          if [ -z "$f" ]; then echo "settings.gradle.kts topilmadi"; ls -R | head -50; exit 1; fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Loyiha papkasi: $d"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Debug APK build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle --version && gradle :app:assembleDebug --stacktrace --console=plain

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: GpsTracker-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Xato hisoboti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.find.outputs.dir }}/app/build/reports/**
          if-no-files-found: ignore
