name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK va NDK o'rnatish
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "ndk;29.0.14206865"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (openDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleOpenDebug --stacktrace

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Porte-debug-apk
          path: app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
