name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK va NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKM" --licenses > /dev/null 2>&1

          echo "--- Mavjud paketlar (stable) ---"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|ndk;29" || true
          echo "--- Mavjud paketlar (barcha kanallar) ---"
          "$SDKM" --list --channel=3 2>/dev/null | grep -E "platforms;android-3[6-9]|ndk;29" || true

          "$SDKM" "ndk;29.0.14206865" || "$SDKM" --channel=3 "ndk;29.0.14206865"

          for p in "platforms;android-37.0" "platforms;android-37"; do
            "$SDKM" "$p" && break
            "$SDKM" --channel=3 "$p" && break
          done

          echo "--- O'rnatilgan platformalar ---"
          ls "$ANDROID_HOME/platforms" || true
          exit 0

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (openDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleOpenDebug --stacktrace

      - name: APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Porte-debug-apk
          path: app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
