name: GPS Tracker v3 Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle(.kts) topilmadi"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$FILE")
          if [ "$DIR" = "." ]; then
            DIR="$GITHUB_WORKSPACE"
          else
            DIR="$GITHUB_WORKSPACE/${DIR#./}"
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $DIR"
          ls -la "$DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tracker-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
