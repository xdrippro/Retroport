name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "XATO: repozitoriy ildizida .zip fayl yo'q"; exit 1; fi
          echo "Zip: $Z"
          unzip -q -o "$Z" -d proj
          P=$(dirname "$(dirname "$(find proj -name prepare.py | head -1)")")
          echo "P=$P" >> "$GITHUB_ENV"
          ls "$P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare
        working-directory: ${{ env.P }}
        run: python3 tools/prepare.py game/game.jar .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build release APK
        working-directory: ${{ env.P }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Asphalt6-Lite-APK
          path: ${{ env.P }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
