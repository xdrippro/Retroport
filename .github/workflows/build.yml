name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main, dev ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Repoda faqat zip bo'lsa (gradlew yo'q), uni ochib, ichidagini ildizga ko'chiradi
      - name: Unzip project
        run: |
          if [ ! -f gradlew ]; then
            Z=$(ls *.zip 2>/dev/null | head -1)
            [ -z "$Z" ] && { echo "gradlew ham, zip ham topilmadi"; exit 1; }
            mkdir -p _src && unzip -q "$Z" -d _src
            if [ "$(ls -A _src | wc -l)" = "1" ] && [ -d "$(ls -d _src/*/ | head -1)" ]; then
              cp -a _src/*/. .
            else
              cp -a _src/. .
            fi
            rm -rf _src
          fi
          ls

      # TinySoundFont submodule bo'sh bo'lib qolsa (zip'dan yuklangan repo), qo'lda tortamiz
      - name: Ensure TinySoundFont
        run: |
          D=app/src/main/cpp/mmapi_tsf/TinySoundFont
          if [ ! -f "$D/tsf.h" ]; then
            rm -rf "$D"
            git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$D"
          fi
          ls "$D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts: ndkVersion = 22.1.7171670
      - name: Install NDK 22.1.7171670
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670"

      # Secrets bo'lsa shuni ishlatadi, bo'lmasa vaqtinchalik kalit yaratadi (APK o'rnatiladigan bo'lishi uchun)
      - name: Prepare signing key
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ] && [ -n "$ENCODED_PROPS" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
            echo "$ENCODED_PROPS" | base64 -di > keystore.properties
          else
            keytool -genkeypair -v -keystore keystore.jks -storetype PKCS12 \
              -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=JL-Mod, O=JL-Mod, C=UZ"
            cat > keystore.properties << PROPS
          keyAlias=key0
          keyPassword=android123
          storeFile=keystore.jks
          storePassword=android123
          PROPS
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleEmulatorRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JL-Mod-APK
          path: app/build/outputs/apk/emulator/release/*.apk
          if-no-files-found: error

      - name: Upload mapping (R8)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping
          path: app/build/outputs/mapping/**
          if-no-files-found: ignore

      - name: GitHub Release (tag bo'lsa)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/emulator/release/*.apk
