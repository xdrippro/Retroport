name: GPS Tracker v3 - Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gps-tracker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project directory
        id: project
        shell: bash
        run: |
          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f "gpsv3/settings.gradle.kts" && -f "gpsv3/app/build.gradle.kts" ]]; then
            echo "dir=gpsv3" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android project not found. Expected settings.gradle.kts and app/build.gradle.kts in repository root or gpsv3/."
            ls -la
            exit 1
          fi

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tracker-v3-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
